[package]
name = "mirador"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Julian Chultarsky <jchultarsky@gmail.com>"]
description = "An opinionated personal dashboard for your terminal: world clocks, a calendar, weather, tasks, notes, a market watchlist, and live CPU and network graphs."
readme = "README.md"
homepage = "https://github.com/jchultarsky/mirador"
repository = "https://github.com/jchultarsky/mirador"
license = "MIT"
keywords = ["tui", "dashboard", "terminal", "ratatui", "todo"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github", "/docs", "*.gif", "*.png"]

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
jiff = { version = "0.2.34", features = ["serde"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.3"
unicode-width = "0.2.2"
ureq = "3.3.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
