[package]
name = "mirador"
version = "1.9.0"
edition = "2024"
rust-version = "1.95"
authors = ["Julian Chultarsky <jchultarsky@gmail.com>"]
description = "An opinionated personal dashboard for your terminal: world clocks, a calendar, weather, tasks, notes, a market watchlist, and live CPU and network graphs."
readme = "README.md"
homepage = "https://github.com/jchultarsky/mirador"
repository = "https://github.com/jchultarsky/mirador"
license = "MIT"
keywords = ["tui", "dashboard", "terminal", "ratatui", "todo"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github", "/docs", "*.gif", "*.png"]

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
jiff = { version = "0.2.34", features = ["serde"] }
quick-xml = "0.42.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.3"
unicode-width = "0.2.2"
ureq = "3.4.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with.
#
# `dist init` writes `lto = "thin"` here, which quietly undoes the `lto = true`
# above — the previous workflow shipped `cargo build --release`, so every
# release so far has been fat-LTO'd and there is no reason for the binaries to
# get slower the release we start using dist. Inheriting release unchanged
# keeps fat LTO, codegen-units = 1 and strip. The cost is build time in CI,
# which nobody is waiting on.
[profile.dist]
inherits = "release"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Checksums to generate for each App
checksum = "sha256"
# Have GitHub sign a provenance attestation for every artifact, so anyone can
# prove a download was built by this repository's workflow from this commit:
#
#   gh attestation verify --repo jchultarsky/mirador mirador-<triple>.tar.gz
#
# This is the only integrity check that covers *all* the artifacts. The shell
# installer verifies sha256 for the archive but not for the updater binary, and
# the PowerShell installer verifies nothing at all — both are dist's behaviour,
# not ours. See SECURITY.md for what is and is not checked.
github-attestations = true
# Embed the dependency list in the shipped binaries, so `cargo audit bin
# mirador` can tell someone whether the binary they downloaded contains a
# vulnerable crate. Without it, auditing a release means trusting that the tag
# matches the source — which is exactly what an audit is supposed to establish
# rather than assume.
cargo-auditable = true
# Ship the standalone updater alongside the shell and PowerShell installers, so
# someone who installed without a package manager can run `mirador-update`
# rather than going back to the releases page. It only ever runs when invoked.
install-updater = true
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
