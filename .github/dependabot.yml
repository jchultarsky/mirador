version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Patch bumps rarely need individual review; batch them into one PR.
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    # `release.yml` is generated by `dist` from [workspace.metadata.dist] in
    # Cargo.toml. It is build output, not a workflow anybody maintains, and its
    # action pins move when cargo-dist moves. A dependabot PR that bumps one of
    # them puts the file out of step with what `dist generate` produces, and the
    # `plan` job then fails with "run 'dist init' to update the file" — the guard
    # working, and the PR being the thing that is wrong. #183 was exactly that.
    #
    # **Close those PRs; do not merge them.** There is deliberately no `ignore`
    # entry for it, because there cannot be one: dependabot scopes
    # github-actions by directory and not by file, and both workflows use
    # `actions/checkout`. Ignoring it by name would silence `ci.yml` too, which
    # is hand-maintained and does want the updates.
    ignore:
      # dtolnay/rust-toolchain publishes a ref per Rust release rather than
      # ordinary semver tags, and dependabot orders them numerically: it read
      # the MSRV job's `@1.95.0` pin and proposed `@1.100.0`, a Rust version
      # that does not exist. The job then fails installing it — a 404 from
      # static.rust-lang.org — which is what PR #1 was.
      #
      # Every use of it is pinned by commit, and the Rust version it installs
      # is set through its `toolchain` input instead: `1.95.0` in the MSRV job,
      # tracking `rust-version` in Cargo.toml; `1.99.0` in the lint and docs
      # jobs, moved by hand (see CLAUDE.md); `stable` everywhere else. So no
      # version update to this action is ever wanted here.
      - dependency-name: dtolnay/rust-toolchain
